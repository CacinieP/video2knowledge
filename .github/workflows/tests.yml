name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install test dependencies, ffmpeg and CJK font
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-wqy-microhei
          python -m pip install -r requirements-test.txt
      - name: Run unit and CLI regressions
        run: python -m pytest -q
      - name: Run binary frame-stream regression
        run: python tests/test_pgm_stream.py
